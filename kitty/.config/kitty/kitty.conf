dynamic_background_opacity yes 
background_opacity 0.7
#background_tint 0.9 
allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration enabled

action_alias kitty_scrollback_nvim kitten /home/owen/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

map ctrl+shift+j kitty_scrollback_nvim
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+shift+left  move_tab_backward
map ctrl+shift+right move_tab_forward
map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard
map ctrl+shift+c send_text all \x03
map ctrl+shift+d send_text all \x04
#map ctrl+shift+, no_op
#map ctrl+shift+. no_op
scrollback_lines 100000
#map ctrl+shift+a launch --stdin-source=@screen_scrollback xsel --clipboard --input
map ctrl+backspace send_text all \x17
map ctrl+apostrophe send_key ctrl+shift+alt+f9
map ctrl+semicolon send_key ctrl+shift+alt+f10
